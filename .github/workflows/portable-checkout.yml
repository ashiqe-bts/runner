name: Portable checkout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-web-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool test_driver
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build browser game
        run: flutter build web --release
      - name: Build Android debug APK
        run: flutter build apk --debug
